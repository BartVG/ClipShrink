name: tests

# Runs everything that doesn't need private footage or an NVIDIA card. The full
# check (check.bat) also needs a real GoPro clip, so it runs on a developer's PC.
# The tests that start the real player are left out here because mpv stops
# responding on these test machines. They still run in check.bat.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python tools\fetch_vendor.py
      - name: Run tests without the real-clip ones
        run: .venv\Scripts\python -m pytest tests -q --tb=short --deselect tests/test_quality.py::test_real_clip_supplied --deselect tests/test_player.py --deselect tests/test_codec_and_size.py::test_side_by_side_works_when_sizes_differ_and_stays_in_sync --deselect tests/test_version_1_7.py::test_real_player_zooms_400_percent
